<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Taxis</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">
        🚕 Sistema de Control y Manejo de Taxis
      </span>
      <span class="text-light" id="fechaHora"></span>
    </div>
  </nav>

  <div class="container">

    <!-- PRÓXIMO TAXI A SALIR -->
    <div class="text-center mt-4">
      <h5 class="text-muted">Próximo taxi a salir</h5>
      <h2 id="proximoTaxi" class="fw-bold"></h2>
    </div>
    
    <!-- TABLA DE COLA -->
    <div class="card">
      <div class="card-header bg-primary text-white text-center">
        Cola Digital de Taxis
      </div>
      <div class="card-body">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>#</th>
              <th>Placa</th>
              <th>Conductor</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tablaTaxis">
            <!-- Datos dinámicos -->
          </tbody>
        </table>
      </div>
    </div>

    

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript propio -->
  <script src="script.js"></script>

</body>
</html>
